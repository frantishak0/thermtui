name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python3 -m py_compile thermtui.py render_test.py
      - name: CLI
        run: python3 thermtui.py --help
      - name: Sensor discovery
        run: python3 -c "import thermtui as t; print([(s.id, s.name) for s in t.discover_series()])"
